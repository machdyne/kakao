# The Kakao SOC's bitstreams for a release: every board built with
# soc/tools/release.sh and attached to the GitHub release of the tag.
#
# NOT YET RUN: written without a repository to try it in. The script it
# calls is what is tested (soc/boards: make release).
#
# Runs for a tag soc-v*, or by hand (then the files are only kept as the
# run's artifact). The card's common files (OpenSBI, the kernel, the root
# file system) are not built here.

name: Kakao SOC release

on:
  push:
    tags: ['soc-v*']
  workflow_dispatch:
    inputs:
      boards:
        description: 'boards to build (empty: all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bitstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf device-tree-compiler zip python3
          # yosys, nextpnr-ecp5 and ecppack
          curl -sL -o oss.tgz "$(curl -s https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest \
            | grep -o 'https://[^"]*linux-x64[^"]*\.tgz' | head -1)"
          tar xzf oss.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Build every board
        run: |
          v=${GITHUB_REF_NAME#soc-}
          sh soc/tools/release.sh -v "$v" -o release ${{ github.event.inputs.boards }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kakao-soc
          path: release/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/soc-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/kakao-soc-*.zip
            release/SHA256SUMS
            release/SUMMARY.md
          body_path: release/SUMMARY.md
